<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ripple Effect</title>
  <style>
    body { background: #2c3e50; height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
    .btn { position: relative; padding: 20px 50px; background: #f368e0; color: white; border: none; border-radius: 50px; font-size: 1.2em; cursor: pointer; overflow: hidden; }
    .ripple { position: absolute; background: rgba(255,255,255,0.5); border-radius: 50%; transform: scale(0); animation: ripple 0.6s linear; }
    @keyframes ripple { to { transform: scale(4); opacity: 0; } }
  </style>
</head>
<body>
  <button class="btn" onclick="createRipple(event)">Click Me</button>
  <script>
    function createRipple(e) {
      const btn = e.currentTarget;
      const ripple = document.createElement('span');
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = e.clientX - rect.left - size/2 + 'px';
      ripple.style.top = e.clientY - rect.top - size/2 + 'px';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }
  </script>
</body>
</html>
